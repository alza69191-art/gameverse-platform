name: Refresh GameVerse open catalog
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh F-Droid discovery index
        run: node scripts/sync-fdroid-catalog.mjs
      - name: Commit catalog when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fdroid-catalog.json
          git diff --cached --quiet || (git commit -m "Refresh F-Droid app discovery catalog" && git push)
