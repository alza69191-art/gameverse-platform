name: Discover open-source game candidates
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: write
  pull-requests: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover candidate repositories
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover-open-source-games.mjs
      - name: Propose reviewed candidate queue
        uses: peter-evans/create-pull-request@v7
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          branch: automation/game-catalog-candidates
          delete-branch: true
          commit-message: "Refresh open-source game discovery candidates"
          title: "Review new open-source game candidates"
          body: |
            Automated discovery only. This PR does not publish games.
            Review repository completeness, current demo, source licence, art/audio/font licences,
            attribution, trademarks, build instructions and security before adding any title to
            the public catalogue.
          add-paths: data/game-candidates.json
