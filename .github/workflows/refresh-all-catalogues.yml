name: Refresh all GameVerse catalogues
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import F-Droid app metadata
        run: node scripts/sync-fdroid-catalog.mjs
      - name: Import OpenUse cross-platform open-source catalogue
        run: node scripts/sync-openuse-catalog.mjs
      - name: Discover GitHub game projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover-open-source-games.mjs
      - name: Commit refreshed catalogues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fdroid-catalog.json data/openuse-catalog.json data/game-candidates.json
          git diff --cached --quiet || (git commit -m "Refresh GameVerse global catalogues" && git push)
