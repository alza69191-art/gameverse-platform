name: Refresh all GameVerse catalogues
on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-fdroid-catalog.mjs"
      - "scripts/sync-openuse-catalog.mjs"
      - "scripts/sync-game-catalog.mjs"
      - "scripts/sync-curlie-directory.mjs"
      - "scripts/discover-open-source-games.mjs"
      - ".github/workflows/refresh-all-catalogues.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import F-Droid app metadata
        continue-on-error: true
        run: node scripts/sync-fdroid-catalog.mjs
      - name: Import OpenUse cross-platform apps
        continue-on-error: true
        run: node scripts/sync-openuse-catalog.mjs
      - name: Import open-source and free-to-play game catalogues
        continue-on-error: true
        run: node scripts/sync-game-catalog.mjs
      - name: Import Curlie global website directory
        continue-on-error: true
        env:
          CURLIE_MAX_ENTRIES: "25000"
        run: node scripts/sync-curlie-directory.mjs
      - name: Discover additional GitHub game projects
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover-open-source-games.mjs
      - name: Validate generated catalogues
        run: |
          node --check scripts/sync-game-catalog.mjs
          node -e "for (const f of ['data/fdroid-catalog.json','data/openuse-catalog.json','data/game-catalog.json','data/site-catalog.json']) { const d=JSON.parse(require('fs').readFileSync(f,'utf8')); console.log(f, d.total ?? d.items?.length ?? 0); }"
      - name: Commit refreshed catalogues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fdroid-catalog.json data/openuse-catalog.json data/game-catalog.json data/site-catalog.json data/game-candidates.json
          git diff --cached --quiet || (git commit -m "Refresh expanded GameVerse app and game catalogues" && git push)
