name: Refresh GameVerse GitHub game candidates
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 2"
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover open-source game repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover-open-source-games.mjs
      - name: Commit discovery index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game-candidates.json
          git diff --cached --quiet || (git commit -m "Refresh GitHub game discovery candidates" && git push)
